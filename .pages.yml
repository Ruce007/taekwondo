# Generated by scripts/cms-config.mjs. Do not edit by hand; run `npm run cms:config`.
media:
  input: public/media
  output: /media
content:
  - name: articles
    label: "Wiki"
    type: collection
    path: content/articles
    format: yaml-frontmatter
    filename: "{primary}.md"
    subfolders: false
    view:
      primary: title
    fields:
      - name: title
        type: string
        required: true
        description: "Page title."
      - name: summary
        type: text
        required: true
        description: "One or two sentences, 40 to 160 characters. Used as the search-engine description."
      - name: updated
        type: date
        required: true
        description: "Date the sources were last checked."
      - name: status
        type: select
        options:
          values: ["provisional", "reviewed"]
        description: "Use \"reviewed\" only after the facts were checked against primary sources."
      - name: statusNote
        type: text
        description: "Optional. Replaces the standard provisional note with a page-specific one."
      - name: meta
        type: string
        description: "Short line under the title in listings, for example \"Founder of the ITF, 1918 to 2002\"."
      - name: aliases
        type: string
        list: true
        description: "Other names people use for this page. Each one works as a [[link]]."
      - name: infobox
        type: string
        list: true
        description: "Quick facts, one per line, written \"Label: value\"."
      - name: related
        type: string
        list: true
        description: "Related pages, for example \"articles/etymology\" or a page title."
      - name: sources
        type: string
        list: true
        description: "Sources in order, written \"Title | https://address\". Citation [^1] is the first one."
      - name: redirectFrom
        type: string
        list: true
        description: "Old addresses that should lead here, for example /old-page/."
      - name: category
        type: select
        required: true
        options:
          values: ["Fundamentals", "History", "Practice", "Competition", "Directories"]
        description: "Where the page appears on the Wiki index."
      - name: body
        type: code
        options:
          language: markdown
        description: "Page text in Markdown. [[Page title]] links to a page; [^1] cites a source."
